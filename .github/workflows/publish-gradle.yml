---
name: publish-gradle

on:
  workflow_call:
    inputs:
      java_version:
        description: Java version for setup-java
        type: string
        required: false
        default: 25
    secrets:
      gradle_enterprise_access_key:
        description: Value of the Gradle Enterprise access token to use.
        required: false

      # TODO Still used. Drop once org.openrewrite.build.publish stops applying the signing plugin,
      # then remove after dropping the last caller. See openrewrite/rewrite-build-gradle-plugin#220.
      ossrh_signing_key:
        required: false
      ossrh_signing_password:
        required: false

      node_auth_token:
        required: false
      pypi_token:
        required: false
      nuget_api_key:
        required: false
      artifactory_username:
        description: >
          No longer read: the Maven and Gradle mirrors read the Code Genome Project's Maven cache with
          CODEGENOME_USERNAME and CODEGENOME_TOKEN. Still declared, so that callers passing it still run.
        required: false
      artifactory_password:
        description: >
          No longer read: the Maven and Gradle mirrors read the Code Genome Project's Maven cache with
          CODEGENOME_USERNAME and CODEGENOME_TOKEN. Still declared, so that callers passing it still run.
        required: false
      cgp_aws_access_key_id:
        description: AWS access key id for the Maven dual-publish to the Code Genome Project.
        required: false
      cgp_aws_secret_access_key:
        description: AWS secret access key for the Maven dual-publish to the Code Genome Project.
        required: false
      cgp_publish_token:
        description: >
          Code Genome Project token carrying the `publish` entitlement, used by the npm/PyPI/NuGet
          publish tasks. Unrelated to the AWS keys above, which drive the Maven publish only.
        required: false
      CODEGENOME_USERNAME:
        description: Username for artifacts.codegenomeproject.org, used to resolve org.openrewrite and io.moderne dependencies.
        required: false
      CODEGENOME_TOKEN:
        description: Token for artifacts.codegenomeproject.org, used to resolve org.openrewrite and io.moderne dependencies.
        required: false

env:
  GRADLE_SWITCHES: --console=plain --info --stacktrace --warning-mode=all --no-daemon --refresh-dependencies
  ORG_GRADLE_PROJECT_signingKey: ${{ secrets.ossrh_signing_key }}
  ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.ossrh_signing_password }}
  ORG_GRADLE_PROJECT_nodeAuthToken: ${{ secrets.node_auth_token }}
  ORG_GRADLE_PROJECT_pypiToken: ${{ secrets.pypi_token }}
  ORG_GRADLE_PROJECT_nugetApiKey: ${{ secrets.nuget_api_key }}
  # The npm/PyPI/NuGet publish tasks. Empty when a repo has not forwarded the secret, which is why
  # each of those tasks tests for blank rather than merely present.
  ORG_GRADLE_PROJECT_cgpPublishToken: ${{ secrets.cgp_publish_token }}
  # The Code Genome Project's Maven cache, with the token below. Readers of these three use the mirror only
  # when all three are set, so a repo that has not forwarded the token reads Central itself.
  MAVEN_CENTRAL_MIRROR_URL: https://artifacts.codegenomeproject.org/maven-public/
  MAVEN_CENTRAL_MIRROR_USERNAME: ${{ secrets.CODEGENOME_USERNAME }}
  MAVEN_CENTRAL_MIRROR_PASSWORD: ${{ secrets.CODEGENOME_TOKEN }}
  # The MAVEN dual-publish to the Code Genome Project, and nothing else: this is Gradle's own s3://
  # transport under org.openrewrite.build.publish-cgp, not the package publishing above. Empty when
  # a repo has not forwarded the secret, which leaves that convention plugin inert.
  AWS_ACCESS_KEY_ID: ${{ secrets.cgp_aws_access_key_id }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.cgp_aws_secret_access_key }}
  AWS_REGION: us-west-2
  # Gradle's own s3:// transport still bundles AWS SDK for Java 1.x, which prints a
  # deprecation banner with a stack trace on every upload. Drop once Gradle ships
  # https://github.com/gradle/gradle/pull/29686 (milestone 9.8.0).
  AWS_JAVA_V1_DISABLE_DEPRECATION_ANNOUNCEMENT: true
  # Resolve org.openrewrite and io.moderne dependencies from the Code Genome Project. Empty when a
  # repo has not forwarded the secret, which leaves the recipe-repositories convention plugin inert.
  ORG_GRADLE_PROJECT_codegenomeUsername: ${{ secrets.CODEGENOME_USERNAME }}
  ORG_GRADLE_PROJECT_codegenomePassword: ${{ secrets.CODEGENOME_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - uses: astral-sh/setup-uv@v7

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          develocity-access-key: ${{ secrets.gradle_enterprise_access_key }}

      # Route Maven resolution through the Code Genome Project's Maven cache, maven-public, to avoid
      # Maven Central rate-limiting (HTTP 429) under parallel test load. Without a CGP token, Central itself.
      - uses: s4u/maven-settings-action@v4.0.0
        with:
          mirrors: ${{ secrets.CODEGENOME_TOKEN != '' && '[{"id":"moderne-cache","name":"Code Genome Project Maven cache","mirrorOf":"*","url":"https://artifacts.codegenomeproject.org/maven-public/"}]' || '[]' }}
          servers: ${{ secrets.CODEGENOME_TOKEN != '' && format('[{{"id":"moderne-cache","username":"{0}","password":"{1}"}}]', secrets.CODEGENOME_USERNAME, secrets.CODEGENOME_TOKEN) || '[]' }}

      - name: publish-candidate
        if: contains(github.ref, '-rc.')
        run: |
          ./gradlew \
          ${{ env.GRADLE_SWITCHES }} \
          -Preleasing \
          -Prelease.disableGitChecks=true \
          -Prelease.useLastTag=true \
          candidate \
          publish

      - name: publish-release
        if: (!contains(github.ref, '-rc.'))
        run: |
          ./gradlew \
          ${{ env.GRADLE_SWITCHES }} \
          -Preleasing \
          -Prelease.disableGitChecks=true \
          -Prelease.useLastTag=true \
          final \
          publish
