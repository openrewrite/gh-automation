---
name: ci-gradle

on:
  workflow_call:
    inputs:
      java_version:
        description: Java version for setup-java
        type: string
        required: false
        default: 21
      publish_snapshots:
        description: Whether to attempt publishing snapshots. When false, the workflow will only run build.
        type: boolean
        default: true
        required: false
      # Non-Maven distributables to publish to the Code Genome Project. Empty (the default) means
      # the step does not run at all, so a repo that publishes nothing but jars is completely
      # unaffected — the CGP Maven dual-publish it may already do is a separate mechanism (the
      # publish-cgp convention plugin, driven by the cgp_aws_* secrets).
      #
      # These name what `publish` BUILT, not what it pushed: `publish` depends on the packaging
      # tasks (pythonBuild / csharpPack / npmPack) unconditionally, while each push to PyPI /
      # nuget.org / npmjs is separately gated on that registry's own credential. CGP is therefore
      # a destination in its own right rather than a copy of the public registry, and retiring a
      # public registry is a deletion — drop its push and its secret — that leaves CGP untouched.
      cgp_npm_artifacts:
        description: Globs naming the npm tarballs to publish, e.g. `rewrite-javascript/build/distributions/*.tgz`.
        type: string
        required: false
        default: ''
      cgp_pypi_artifacts:
        description: Globs naming the wheels/sdists to publish, e.g. `rewrite-python/rewrite/dist/*`.
        type: string
        required: false
        default: ''
      cgp_nuget_artifacts:
        description: Globs naming the .nupkg files to publish, e.g. `rewrite-csharp/csharp/dist/*.nupkg`.
        type: string
        required: false
        default: ''
    secrets:
      gradle_enterprise_access_key:
        description: Value of the Gradle Enterprise access token to use.
        required: false
      sonatype_username:
        required: false
      sonatype_token:
        required: false
      ossrh_signing_key:
        required: false
      ossrh_signing_password:
        required: false
      OPS_GITHUB_ACTIONS_WEBHOOK:
        required: false
      node_auth_token:
        required: false
      pypi_token:
        required: false
      nuget_api_key:
        required: false
      artifactory_username:
        description: Username for artifactory.moderne.ninja, used for both the Maven mirror and the Gradle mirror.
        required: false
      artifactory_password:
        description: Password for artifactory.moderne.ninja, used for both the Maven mirror and the Gradle mirror.
        required: false
      cgp_aws_access_key_id:
        required: false
      cgp_aws_secret_access_key:
        required: false
      cgp_artifacts_maven_username:
        description: Username for artifacts.codegenomeproject.org, used to resolve org.openrewrite and io.moderne dependencies.
        required: false
      cgp_artifacts_maven_token:
        description: Token for artifacts.codegenomeproject.org, used to resolve org.openrewrite and io.moderne dependencies.
        required: false

# Resolve org.openrewrite and io.moderne dependencies from the Code Genome Project. Empty when a
# repo has not forwarded the secret, which leaves the recipe-repositories convention plugin inert.
env:
  ORG_GRADLE_PROJECT_codegenomeUsername: ${{ secrets.cgp_artifacts_maven_username }}
  ORG_GRADLE_PROJECT_codegenomePassword: ${{ secrets.cgp_artifacts_maven_token }}

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.repository_owner == 'openrewrite' || github.repository_owner == 'moderneinc'
    steps:
      - uses: openrewrite/gh-automation/.github/actions/setup@main
        with:
          java_version: ${{ inputs.java_version }}
          develocity_access_key: ${{ secrets.gradle_enterprise_access_key }}

      # Route Maven resolution through Moderne's Artifactory cache to avoid
      # Maven Central rate-limiting (HTTP 429) under parallel test load.
      - uses: s4u/maven-settings-action@v4.0.0
        with:
          mirrors: '[{"id": "moderne-cache", "name": "Moderne Artifactory Cache", "mirrorOf": "*", "url": "https://artifactory.moderne.ninja/artifactory/moderne-cache-3/"}]'
          servers: ${{ secrets.artifactory_username != '' && format('[{{"id":"moderne-cache","username":"{0}","password":"{1}"}}]', secrets.artifactory_username, secrets.artifactory_password) || '[]' }}

      - uses: openrewrite/gh-automation/.github/actions/build@main
        env:
          REWRITE_GRADLE_MIRROR_URL: https://artifactory.moderne.ninja/artifactory/moderne-cache-3/
          REWRITE_GRADLE_MIRROR_USERNAME: ${{ secrets.artifactory_username }}
          REWRITE_GRADLE_MIRROR_PASSWORD: ${{ secrets.artifactory_password }}

      - if: failure() && github.event_name == 'schedule' && (github.repository_owner == 'openrewrite' || github.repository_owner == 'moderneinc')
        uses: openrewrite/gh-automation/.github/actions/slack-failure@main
        with:
          webhook: ${{ secrets.OPS_GITHUB_ACTIONS_WEBHOOK }}

      - if: >
          inputs.publish_snapshots &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          (github.repository_owner == 'openrewrite' || github.repository_owner == 'moderneinc')
        uses: openrewrite/gh-automation/.github/actions/publish-snapshots@main
        with:
          sonatype_username: ${{ secrets.sonatype_username }}
          sonatype_token: ${{ secrets.sonatype_token }}
          ossrh_signing_key: ${{ secrets.ossrh_signing_key }}
          ossrh_signing_password: ${{ secrets.ossrh_signing_password }}
          node_auth_token: ${{ secrets.node_auth_token }}
          pypi_token: ${{ secrets.pypi_token }}
          nuget_api_key: ${{ secrets.nuget_api_key }}
          cgp_aws_access_key_id: ${{ secrets.cgp_aws_access_key_id }}
          cgp_aws_secret_access_key: ${{ secrets.cgp_aws_secret_access_key }}

      # Publish the npm/PyPI/NuGet distributables to the Code Genome Project. CGP is a destination
      # in its own right, not a copy of the public registry: `publish` builds the distributable
      # unconditionally and each registry push is gated on its own credential, so retiring a public
      # registry is deleting a step and a secret rather than a rewiring.
      #
      # !cancelled() is what makes that independence real at the workflow level. Without it a failed
      # twine or `dotnet nuget push` fails the step above and GitHub skips everything after it, so a
      # public-registry outage would silently take CGP down with it. The build tasks run before the
      # push tasks within the same Gradle invocation, so the artifacts are on disk either way.
      #
      # The publish guard is otherwise repeated verbatim rather than factored out, so nothing about
      # the existing step's behavior can shift. The action is inert without cgp_aws_access_key_id,
      # which is the real safety net.
      #
      # The npm dist-tag is a pure function of the trigger and so is decided here rather than
      # threaded in from the caller: everything `ci` publishes is a snapshot, and a snapshot is
      # `next`. publish-gradle.yml resolves `latest` vs `next` from the tag. Between them they
      # apply the same rule as the `npm publish --tag` in each repo's npm-publish.yml.
      - if: >
          !cancelled() &&
          inputs.cgp_npm_artifacts != '' &&
          inputs.publish_snapshots &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          (github.repository_owner == 'openrewrite' || github.repository_owner == 'moderneinc')
        uses: openrewrite/gh-automation/.github/actions/publish-cgp-packages@main
        with:
          ecosystem: npm
          artifacts: ${{ inputs.cgp_npm_artifacts }}
          dist_tag: next
          aws_access_key_id: ${{ secrets.cgp_aws_access_key_id }}
          aws_secret_access_key: ${{ secrets.cgp_aws_secret_access_key }}

      - if: >
          !cancelled() &&
          inputs.cgp_pypi_artifacts != '' &&
          inputs.publish_snapshots &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          (github.repository_owner == 'openrewrite' || github.repository_owner == 'moderneinc')
        uses: openrewrite/gh-automation/.github/actions/publish-cgp-packages@main
        with:
          ecosystem: pypi
          artifacts: ${{ inputs.cgp_pypi_artifacts }}
          aws_access_key_id: ${{ secrets.cgp_aws_access_key_id }}
          aws_secret_access_key: ${{ secrets.cgp_aws_secret_access_key }}

      - if: >
          !cancelled() &&
          inputs.cgp_nuget_artifacts != '' &&
          inputs.publish_snapshots &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          (github.repository_owner == 'openrewrite' || github.repository_owner == 'moderneinc')
        uses: openrewrite/gh-automation/.github/actions/publish-cgp-packages@main
        with:
          ecosystem: nuget
          artifacts: ${{ inputs.cgp_nuget_artifacts }}
          aws_access_key_id: ${{ secrets.cgp_aws_access_key_id }}
          aws_secret_access_key: ${{ secrets.cgp_aws_secret_access_key }}
