---
name: publish-gradle

on:
  workflow_call:
    inputs:
      java_version:
        description: Java version for setup-java
        type: string
        required: false
        default: 21
      # Non-Maven packages the Gradle publish just BUILT, to be mirrored into the Code Genome
      # Project package repositories. Empty (the default) means the mirror step does not run at
      # all, so a repo that publishes nothing but jars is completely unaffected.
      #
      # Built, not pushed: `publish` depends on the packaging tasks (pythonBuild / csharpPack /
      # npmPack) unconditionally, and each push to PyPI / nuget.org / npmjs is separately gated
      # on that registry's own credential. So the mirror consumes a build output rather than a
      # side effect of a public-registry push, and retiring a public registry is a deletion —
      # drop its push and its secret — that leaves CGP untouched.
      cgp_npm_artifacts:
        description: Globs naming the npm tarballs to mirror, e.g. `rewrite-javascript/build/distributions/*.tgz`.
        type: string
        required: false
        default: ''
      cgp_pypi_artifacts:
        description: Globs naming the wheels/sdists to mirror, e.g. `rewrite-python/rewrite/dist/*`.
        type: string
        required: false
        default: ''
      cgp_nuget_artifacts:
        description: Globs naming the .nupkg files to mirror, e.g. `rewrite-csharp/csharp/dist/*.nupkg`.
        type: string
        required: false
        default: ''
    secrets:
      gradle_enterprise_access_key:
        description: Value of the Gradle Enterprise access token to use.
        required: false
      sonatype_username:
        required: true
      sonatype_token:
        required: true
      ossrh_signing_key:
        required: true
      ossrh_signing_password:
        required: true
      node_auth_token:
        required: false
      pypi_token:
        required: false
      nuget_api_key:
        required: false
      artifactory_username:
        description: Username for artifactory.moderne.ninja, used for both the Maven mirror and the Gradle mirror.
        required: false
      artifactory_password:
        description: Password for artifactory.moderne.ninja, used for both the Maven mirror and the Gradle mirror.
        required: false
      cgp_aws_access_key_id:
        description: AWS access key id for publishing artifacts to the Code Genome Project.
        required: false
      cgp_aws_secret_access_key:
        description: AWS secret access key for publishing artifacts to the Code Genome Project.
        required: false
      cgp_artifacts_maven_username:
        description: Username for artifacts.codegenomeproject.org, used to resolve org.openrewrite and io.moderne dependencies.
        required: false
      cgp_artifacts_maven_token:
        description: Token for artifacts.codegenomeproject.org, used to resolve org.openrewrite and io.moderne dependencies.
        required: false

env:
  GRADLE_SWITCHES: --console=plain --info --stacktrace --warning-mode=all --no-daemon
  ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.sonatype_username }}
  ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.sonatype_token }}
  ORG_GRADLE_PROJECT_signingKey: ${{ secrets.ossrh_signing_key }}
  ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.ossrh_signing_password }}
  ORG_GRADLE_PROJECT_nodeAuthToken: ${{ secrets.node_auth_token }}
  ORG_GRADLE_PROJECT_pypiToken: ${{ secrets.pypi_token }}
  ORG_GRADLE_PROJECT_nugetApiKey: ${{ secrets.nuget_api_key }}
  REWRITE_GRADLE_MIRROR_URL: https://artifactory.moderne.ninja/artifactory/moderne-cache-3/
  REWRITE_GRADLE_MIRROR_USERNAME: ${{ secrets.artifactory_username }}
  REWRITE_GRADLE_MIRROR_PASSWORD: ${{ secrets.artifactory_password }}
  # Publish releases to the Code Genome Project. Empty when a repo has not forwarded the
  # secret, which leaves the org.openrewrite.build.publish-cgp convention plugin inert.
  AWS_ACCESS_KEY_ID: ${{ secrets.cgp_aws_access_key_id }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.cgp_aws_secret_access_key }}
  AWS_REGION: us-west-2
  # Gradle's own s3:// transport still bundles AWS SDK for Java 1.x, which prints a
  # deprecation banner with a stack trace on every upload. Drop once Gradle ships
  # https://github.com/gradle/gradle/pull/29686 (milestone 9.8.0).
  AWS_JAVA_V1_DISABLE_DEPRECATION_ANNOUNCEMENT: true
  # Resolve org.openrewrite and io.moderne dependencies from the Code Genome Project. Empty when a
  # repo has not forwarded the secret, which leaves the recipe-repositories convention plugin inert.
  ORG_GRADLE_PROJECT_codegenomeUsername: ${{ secrets.cgp_artifacts_maven_username }}
  ORG_GRADLE_PROJECT_codegenomePassword: ${{ secrets.cgp_artifacts_maven_token }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - uses: astral-sh/setup-uv@v7

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          develocity-access-key: ${{ secrets.gradle_enterprise_access_key }}

      # Route Maven resolution through Moderne's Artifactory cache to avoid
      # Maven Central rate-limiting (HTTP 429) under parallel test load.
      - uses: s4u/maven-settings-action@v4.0.0
        with:
          mirrors: '[{"id": "moderne-cache", "name": "Moderne Artifactory Cache", "mirrorOf": "*", "url": "https://artifactory.moderne.ninja/artifactory/moderne-cache-3/"}]'
          servers: ${{ secrets.artifactory_username != '' && format('[{{"id":"moderne-cache","username":"{0}","password":"{1}"}}]', secrets.artifactory_username, secrets.artifactory_password) || '[]' }}

      - name: publish-candidate
        if: contains(github.ref, '-rc.')
        run: |
          ./gradlew \
          ${{ env.GRADLE_SWITCHES }} \
          -Preleasing \
          -Prelease.disableGitChecks=true \
          -Prelease.useLastTag=true \
          candidate \
          publish \
          closeAndReleaseSonatypeStagingRepository

      - name: publish-release
        if: (!contains(github.ref, '-rc.'))
        run: |
          ./gradlew \
          ${{ env.GRADLE_SWITCHES }} \
          -Preleasing \
          -Prelease.disableGitChecks=true \
          -Prelease.useLastTag=true \
          final \
          publish \
          closeAndReleaseSonatypeStagingRepository

      # Mirror the npm/PyPI/NuGet artifacts whichever publish step above just built into the Code
      # Genome Project package repositories. Both publish steps are mutually exclusive and a
      # skipped step counts as success, so plain sequencing reaches this from either path. The
      # release-vs-rc distinction needs no `if:` here: the action reads the version out of the
      # artifact and tags a prerelease `kind=snapshot` on its own.
      #
      # npm's dist-tag does turn on it, and is decided here for the same reason the publish step
      # above keys off `github.ref`: this workflow already has the tag. A release candidate must
      # not claim `latest` ahead of the actual latest release, so an `-rc.` tag goes to `next`
      # alongside the snapshots ci-gradle.yml mirrors — the same rule the `npm publish --tag` in
      # each repo's npm-publish.yml applies.
      - if: inputs.cgp_npm_artifacts != ''
        uses: openrewrite/gh-automation/.github/actions/publish-cgp-packages@main
        with:
          ecosystem: npm
          artifacts: ${{ inputs.cgp_npm_artifacts }}
          dist_tag: ${{ contains(github.ref, '-rc.') && 'next' || 'latest' }}
          aws_access_key_id: ${{ secrets.cgp_aws_access_key_id }}
          aws_secret_access_key: ${{ secrets.cgp_aws_secret_access_key }}

      - if: inputs.cgp_pypi_artifacts != ''
        uses: openrewrite/gh-automation/.github/actions/publish-cgp-packages@main
        with:
          ecosystem: pypi
          artifacts: ${{ inputs.cgp_pypi_artifacts }}
          aws_access_key_id: ${{ secrets.cgp_aws_access_key_id }}
          aws_secret_access_key: ${{ secrets.cgp_aws_secret_access_key }}

      - if: inputs.cgp_nuget_artifacts != ''
        uses: openrewrite/gh-automation/.github/actions/publish-cgp-packages@main
        with:
          ecosystem: nuget
          artifacts: ${{ inputs.cgp_nuget_artifacts }}
          aws_access_key_id: ${{ secrets.cgp_aws_access_key_id }}
          aws_secret_access_key: ${{ secrets.cgp_aws_secret_access_key }}
