---
name: Publish snapshots
description: |
  Run `./gradlew --refresh-dependencies snapshot publish -PforceSigning -x test`
  with Sonatype and signing credentials wired in via Gradle project properties.
  `--refresh-dependencies` is required to clear Gradle's module-to-repository
  cache; without it Gradle can keep resolving `latest.integration` against
  Maven Central only (skipping the Sonatype snapshot repo) once a stale mapping
  has been restored via gradle/actions cache fallback.

  When the CGP AWS credentials are forwarded, an injected init script also publishes
  each snapshot to the Code Genome Project's S3-backed Maven repo.

inputs:
  switches:
    description: Gradle command-line switches.
    required: false
    default: --console=plain --info --stacktrace --warning-mode=all --no-daemon
  sonatype_username:
    required: false
    default: ''
  sonatype_token:
    required: false
    default: ''
  ossrh_signing_key:
    required: false
    default: ''
  ossrh_signing_password:
    required: false
    default: ''
  node_auth_token:
    required: false
    default: ''
  pypi_token:
    required: false
    default: ''
  nuget_api_key:
    required: false
    default: ''
  cgp_aws_access_key_id:
    description: AWS access key id for publishing snapshots to the Code Genome Project.
    required: false
    default: ''
  cgp_aws_secret_access_key:
    description: AWS secret access key for publishing snapshots to the Code Genome Project.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      # --init-script adds the Code Genome Project S3 repo as a second publish target (inert
      # without the CGP creds); the s3.endpoint override points Gradle at the bucket's region so
      # snapshot PUTs sign correctly instead of 301-ing off the us-east-1 global endpoint.
      run: >
        ./gradlew ${{ inputs.switches }}
        --refresh-dependencies snapshot publish -PforceSigning -x test
        --init-script "${{ github.action_path }}/cgp-publish.init.gradle"
        -Dorg.gradle.s3.endpoint=https://s3.us-west-2.amazonaws.com
      env:
        ORG_GRADLE_PROJECT_sonatypeUsername: ${{ inputs.sonatype_username }}
        ORG_GRADLE_PROJECT_sonatypePassword: ${{ inputs.sonatype_token }}
        ORG_GRADLE_PROJECT_signingKey: ${{ inputs.ossrh_signing_key }}
        ORG_GRADLE_PROJECT_signingPassword: ${{ inputs.ossrh_signing_password }}
        ORG_GRADLE_PROJECT_nodeAuthToken: ${{ inputs.node_auth_token }}
        ORG_GRADLE_PROJECT_pypiToken: ${{ inputs.pypi_token }}
        ORG_GRADLE_PROJECT_nugetApiKey: ${{ inputs.nuget_api_key }}
        # Read by cgp-publish.init.gradle to authenticate the Code Genome Project S3 repo. Empty
        # when a repo has not forwarded the secret, which leaves that init script inert.
        AWS_ACCESS_KEY_ID: ${{ inputs.cgp_aws_access_key_id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.cgp_aws_secret_access_key }}
        AWS_REGION: us-west-2

    # A build may record the exact snapshot version of an artifact it just deployed
    # (e.g. rewrite-javascript writes build/npm/publishedVersion.txt) so a decoupled
    # downstream publisher can mirror it. Generic and a no-op when no such file exists.
    - uses: actions/upload-artifact@v7
      with:
        name: published-snapshot-version
        path: '**/build/npm/publishedVersion.txt'
        if-no-files-found: ignore
        retention-days: 7
