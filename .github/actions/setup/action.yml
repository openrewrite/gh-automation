---
name: Set up Gradle build environment
description: |
  Checkout the repository (full history), install the requested JDK(s), set up
  uv, and configure Gradle with optional Develocity access. Designed to be the
  first step a Gradle-based job takes; the build / publish composite actions
  in this repo assume this has run.

inputs:
  java_version:
    description: Java version(s) to install (passed verbatim to actions/setup-java).
    required: false
    default: '21'
  develocity_access_key:
    description: Develocity / Gradle Enterprise access key, if any.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        show-progress: false

    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java_version }}

    - uses: astral-sh/setup-uv@v7

    - uses: gradle/actions/setup-gradle@v5
      with:
        develocity-access-key: ${{ inputs.develocity_access_key }}

    # Lets plugin resolution reach the Code Genome Project. Dropped in init.d rather than passed as
    # --init-script so it covers every Gradle invocation the job goes on to make, and copied after
    # setup-gradle so a restored cache cannot shadow it. See the script for why a project plugin
    # cannot do this. Inert without the CGP credentials.
    - shell: bash
      run: |
        gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
        mkdir -p "$gradle_user_home/init.d"
        cp "${{ github.action_path }}/cgp-resolve.init.gradle" "$gradle_user_home/init.d/"
