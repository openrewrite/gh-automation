---
name: Publish snapshots
description: |
  Run `./gradlew --refresh-dependencies snapshot publish -x test` with the
  publishing credentials wired in via Gradle project properties.
  `--refresh-dependencies` is required to clear Gradle's module-to-repository
  cache; without it Gradle can keep resolving `latest.integration` against
  Maven Central only (skipping the snapshot repository) once a stale mapping
  has been restored via gradle/actions cache fallback.

inputs:
  switches:
    description: Gradle command-line switches.
    required: false
    default: --console=plain --info --stacktrace --warning-mode=all --no-daemon

  # TODO Unused by the default publishing path, but kept wired until 2026-09-08: a repository that
  # applies the deprecated org.openrewrite.build.publish-maven-central plugin to reach Central in an
  # emergency also publishes its snapshots there, and would fail to authenticate without these.
  sonatype_username:
    required: false
    default: ''
  sonatype_token:
    required: false
    default: ''

  # TODO Drop once org.openrewrite.build.publish stops applying the signing plugin; until then
  # RewritePublishPlugin still signs the nebula publication, and an empty key fails the sign tasks
  # outright on releases. See the follow-ups on openrewrite/rewrite-build-gradle-plugin#220.
  ossrh_signing_key:
    required: false
    default: ''
  ossrh_signing_password:
    required: false
    default: ''

  node_auth_token:
    required: false
    default: ''
  pypi_token:
    required: false
    default: ''
  nuget_api_key:
    required: false
    default: ''
  cgp_aws_access_key_id:
    description: AWS access key id for the Maven dual-publish to the Code Genome Project.
    required: false
    default: ''
  cgp_aws_secret_access_key:
    description: AWS secret access key for the Maven dual-publish to the Code Genome Project.
    required: false
    default: ''
  cgp_publish_token:
    description: >
      Code Genome Project token carrying the `publish` entitlement, used by the npm/PyPI/NuGet
      publish tasks. Unrelated to the AWS keys above, which drive the Maven publish only.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      run: ./gradlew ${{ inputs.switches }} --refresh-dependencies snapshot publish -x test
      env:
        ORG_GRADLE_PROJECT_sonatypeUsername: ${{ inputs.sonatype_username }}
        ORG_GRADLE_PROJECT_sonatypePassword: ${{ inputs.sonatype_token }}
        ORG_GRADLE_PROJECT_signingKey: ${{ inputs.ossrh_signing_key }}
        ORG_GRADLE_PROJECT_signingPassword: ${{ inputs.ossrh_signing_password }}
        ORG_GRADLE_PROJECT_nodeAuthToken: ${{ inputs.node_auth_token }}
        ORG_GRADLE_PROJECT_pypiToken: ${{ inputs.pypi_token }}
        ORG_GRADLE_PROJECT_nugetApiKey: ${{ inputs.nuget_api_key }}
        # The npm/PyPI/NuGet publish tasks. Empty when a repo has not forwarded the secret, which is
        # why each of those tasks tests for blank rather than merely present.
        ORG_GRADLE_PROJECT_cgpPublishToken: ${{ inputs.cgp_publish_token }}
        # The MAVEN dual-publish to the Code Genome Project, and nothing else: this is Gradle's own
        # s3:// transport under org.openrewrite.build.publish-cgp, not the package publishing above.
        # Empty when a repo has not forwarded the secret, which leaves that plugin inert.
        AWS_ACCESS_KEY_ID: ${{ inputs.cgp_aws_access_key_id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.cgp_aws_secret_access_key }}
        AWS_REGION: us-west-2
        # Gradle's own s3:// transport still bundles AWS SDK for Java 1.x, which prints a
        # deprecation banner with a stack trace on every upload. Drop once Gradle ships
        # https://github.com/gradle/gradle/pull/29686 (milestone 9.8.0).
        AWS_JAVA_V1_DISABLE_DEPRECATION_ANNOUNCEMENT: true

    # A build may record the exact snapshot version of an artifact it just deployed
    # (e.g. rewrite-javascript writes build/npm/publishedVersion.txt) so a decoupled
    # downstream publisher can mirror it. Generic and a no-op when no such file exists.
    - uses: actions/upload-artifact@v7
      with:
        name: published-snapshot-version
        path: '**/build/npm/publishedVersion.txt'
        if-no-files-found: ignore
        retention-days: 7
